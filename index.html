<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Lite</title>
<style>
* { box-sizing:border-box; }
html,body {width:100%;height:100%;margin:0;overflow:hidden;background:#101827;color:#fff;font-family:Arial,'SamsungOne',sans-serif;}
body {background:radial-gradient(ellipse at 68% 14%,#3b536b 0%,#17273a 35%,#0b1420 70%,#090d16 100%);}
#header {position:absolute;left:6vw;top:6vh;right:6vw;}
#brand {font-size:1.4vw;font-weight:bold;letter-spacing:.25em;color:#b2c5d5;text-transform:uppercase;}
#time {position:absolute;right:0;top:0;font-size:2.3vw;color:#dfebf5;}
h1 {font-weight:400;font-size:5.8vw;margin:10vh 0 1vh;letter-spacing:-.035em;}
p {font-size:1.55vw;color:#b3c4d0;margin:0;}
#tiles {position:absolute;left:6vw;right:6vw;top:49%;display:flex;justify-content:flex-start;align-items:center;}
.tile {position:relative;width:23vw;height:19vh;margin-right:2vw;background:rgba(255,255,255,.11);border:3px solid rgba(255,255,255,.06);border-radius:1.3vw;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:background .15s,border .15s,transform .15s;}
.tile.focus {background:rgba(255,255,255,.22);border-color:#fff;transform:scale(1.045);}
.logo {font-size:4vw;line-height:1;font-weight:bold;margin-bottom:1.5vh;}
.name {font-size:1.65vw;letter-spacing:.01em;}
#status {position:absolute;left:6vw;right:6vw;bottom:8vh;font-size:1.5vw;color:#bfd0dd;min-height:2em;}
#help {position:absolute;left:6vw;right:6vw;bottom:3vh;font-size:1vw;color:#8ca0b1;}
</style>
</head>
<body>
<div id="header"><div id="brand">HOME LITE &middot; 0.4.3</div><div id="time"></div><h1>Your TV. Your apps.</h1><p>Simple. Fast. No sponsored home tiles.</p></div>
<div id="tiles">
  <div class="tile focus" data-app="plex"><div class="logo">P</div><div class="name">Plex</div></div>
  <div class="tile" data-app="prime"><div class="logo">▶</div><div class="name">Prime Video</div></div>
  <div class="tile" data-app="tizentube"><div class="logo">▷</div><div class="name">TizenTube</div></div>
</div>
<div id="status" aria-live="polite">Choose an app and press OK.</div>
<div id="help">← → Move &nbsp; • &nbsp; OK Open &nbsp; • &nbsp; Back Return to TizenBrew</div>
<script>
(function () {
  var tiles = document.querySelectorAll('.tile'), focus = 0;
  function status(msg) { document.getElementById('status').textContent = msg; }
  function redraw() { for (var i=0;i<tiles.length;i++) tiles[i].className = 'tile' + (i===focus ? ' focus' : ''); }
  function clock() { var d = new Date(); document.getElementById('time').textContent = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }
  function openNativeModule() {
    if (!window.tizen || !tizen.application || !tizen.application.getAppsInfo) { status('Tizen app API is unavailable.'); return; }
    tizen.application.getAppsInfo(function (apps) {
      var app = null;
      for (var i = 0; i < apps.length; i++) {
        if (/tizentube/i.test(apps[i].name || '') || /tizentube/i.test(apps[i].id || '')) { app=apps[i]; break; }
      }
      if (!app) {status('TizenTube app not found. Open it from TizenBrew.');return;}
      tizen.application.launch(app.id,function(){},function(e){status('TizenTube launch blocked: ' + (e && e.message ? e.message : 'TV rejected request'));});
    },function(){status('Could not read apps.');});
  }
  function openCurrent() {
    var app=tiles[focus].getAttribute('data-app');
    if (app==='tizentube') { status('Opening TizenTube...'); openNativeModule(); return; }
    status('Opening ' + (app==='prime' ? 'Prime Video' : 'Plex') + '...');
    // The TizenBrew service forwards this request from the TV to its own app API.
    fetch('http://127.0.0.1:47822/launch/' + app, {method:'POST'})
      .then(function(r){return r.json().then(function(j){if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));return j;});})
      .then(function(){ status('Launch request accepted.'); })
      .catch(function(e){ status('Launch helper unavailable: '+e.message+'. Try reopening the module.'); });
  }
  document.addEventListener('keydown',function(e){
    var k=e.keyCode;
    if (k===37) {focus=Math.max(0,focus-1);redraw();e.preventDefault();}
    else if (k===39) {focus=Math.min(tiles.length-1,focus+1);redraw();e.preventDefault();}
    else if (k===13) {openCurrent();e.preventDefault();}
  });
  for(var i=0;i<tiles.length;i++)(function(n){tiles[n].addEventListener('click',function(){focus=n;redraw();openCurrent();});})(i);
  clock();setInterval(clock,30000);
  fetch('http://127.0.0.1:47822/health').then(function(r){if(!r.ok)throw new Error('offline');}).catch(function(){status('Helper service is not running; Plex and Prime shortcuts may not work.');});
})();
</script>
</body>
</html>
